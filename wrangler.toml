
name = "nile-soniq-auth"
main = "worker.js"
compatibility_date = "2026-10-05"

[[d1_databases]]
binding = "DB"
database_name = "nilesoniq-db"
database_id = "c0848806-7d6d-491a-a837-0ee93902f2f9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "nilesoniq-media"

[vars]
# Set payment endpoints as secrets/variables only when you have the real values.
# PESAJET_COLLECTION_URL = ""
# PESAJET_DISBURSEMENT_URL = ""

[assets]
directory = "public"
binding = "ASSETS"
