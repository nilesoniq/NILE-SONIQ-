<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NILE SONIQ - Uganda's #1 Music</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff6600,#ff3300);padding:15px;text-align:center;position:sticky;top:0;z-index:99}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}
.nav{display:flex;gap:10px;justify-content:center;padding:10px;flex-wrap:wrap;background:#111}
.nav button{background:#222;color:#fff;border:1px solid #ff6600;padding:8px 16px;border-radius:20px;cursor:pointer}
.nav button.active,.nav button:hover{background:#ff6600}
.card{background:#1a1a1a;border-radius:12px;padding:12px;margin:10px;display:flex;gap:12px;align-items:center}
.card img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#333}
.btn{background:#ff6600;color:#fff;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-weight:bold}
.input{width:100%;padding:12px;margin:8px 0;background:#222;border:1px solid #333;color:#fff;border-radius:8px}
.file-box{border:2px dashed #ff6600;border-radius:12px;padding:20px;text-align:center;margin:10px 0;cursor:pointer;background:#1a1a1a}
.progress{height:6px;background:#333;border-radius:3px;margin:10px 0;overflow:hidden;display:none}
.progress-bar{height:100%;background:#ff6600;width:0%}
</style>
</head>
<body>
<div class="header"><div class="logo">NILE SONIQ</div><small>UGANDA'S #1 MUSIC PLATFORM</small></div>
<div class="nav">
<button class="active" onclick="showTab('home')">🏠 Home</button>
<button onclick="showTab('trending')">🔥 Trending</button>
<button onclick="showTab('dashboard')">📊 Dashboard</button>
<button onclick="showTab('admin')" id="adminBtn" style="display:none">🛡️ Admin</button>
<button onclick="login()">👤 Artist Login</button>
</div>

<div id="home" class="tab" style="padding:15px">
<h2>🔥 Trending Now</h2><div id="trendingList"></div>
<h2 style="margin-top:20px">🆕 New Releases</h2><div id="newList"></div>
<h2 style="margin-top:20px">📈 Top Charts</h2><div id="topList"></div>
</div>

<div id="dashboard" class="tab" style="display:none;padding:15px">
<h2>Upload Your Music to NILE SONIQ</h2>
<input id="songTitle" class="input" placeholder="Song Title - e.g Kwete">
<input id="artistName" class="input" placeholder="Artist Name">

<div class="file-box" onclick="document.getElementById('picInput').click()">
📷 Add Picture from Gallery<br><small id="picName">Tap to choose image</small>
</div>
<input type="file" id="picInput" accept="image/*" style="display:none" onchange="handlePic(this)">

<div class="file-box" onclick="document.getElementById('songInput').click()">
🎵 Choose Song from Phone<br><small id="songName">Tap to choose MP3 - Selected: none</small>
</div>
<input type="file" id="songInput" accept="audio/*,.mp3,.wav,.m4a" style="display:none" onchange="handleSong(this)">

<div class="progress" id="progressBox"><div class="progress-bar" id="progressBar"></div></div>
<p id="status"></p>

<button class="btn" style="width:100%;padding:15px;margin-top:10px" onclick="uploadToSupabase()">⬆️ UPLOAD TO NILE SONIQ</button>

<h3 style="margin-top:20px">My Uploads</h3><div id="mySongs"></div>
</div>

<div id="homePlayer" style="position:fixed;bottom:0;left:0;right:0;background:#111;padding:10px;display:none;border-top:2px solid #ff6600">
<audio id="audio" controls style="width:100%"></audio>
<p id="nowPlaying" style="text-align:center;margin-top:5px"></p>
</div>

<script>
// ==== PASTE YOUR URL HERE BOSS - 1 LINE ONLY ====
const SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"; // <--- PASTE HERE!!!
const SUPABASE_KEY = "sb_publishable_MJYDrg3qcgynvoRTWHQvAA_qt7nRTDw";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedPicFile = null;
let selectedSongFile = null;
let currentUser = localStorage.getItem('nile_user') || null;

if(currentUser === 'nilesoniq@gmail.com'){document.getElementById('adminBtn').style.display='inline-block'}

function showTab(t){
document.querySelectorAll('.tab').forEach(x=>x.style.display='none');
document.getElementById(t).style.display='block';
document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
if(t==='home') loadSongs();
if(t==='dashboard' &&!currentUser){login(); return;}
}

function login(){
let email = prompt("Enter artist email (use nilesoniq@gmail.com for admin):");
if(!email) return;
let pass = prompt("Enter password (any):");
if(!pass) return;
localStorage.setItem('nile_user', email);
currentUser = email;
alert("Welcome "+email+"! Now you can upload!");
if(email==='nilesoniq@gmail.com') document.getElementById('adminBtn').style.display='inline-block';
showTab('dashboard');
}

function handlePic(input){
selectedPicFile = input.files[0];
document.getElementById('picName').innerText = "Selected: "+selectedPicFile.name;
}
function handleSong(input){
selectedSongFile = input.files[0];
document.getElementById('songName').innerText = "Selected: "+selectedSongFile.name+" ("+(selectedSongFile.size/1024/1024).toFixed(1)+" MB)";
}

async function uploadToSupabase(){
if(!selectedSongFile){alert("Boss choose song from phone first!"); return;}
let title = document.getElementById('songTitle').value || selectedSongFile.name;
let artist = document.getElementById('artistName').value || currentUser || "Unknown Artist";
document.getElementById('status').innerText = "Uploading to NILE SONIQ cloud...";
document.getElementById('progressBox').style.display='block';

try{
// 1. Upload song to bucket 'songs'
let songPath = Date.now()+"_"+selectedSongFile.name.replace(/[^a-zA-Z0-9.]/g,'_');
let {data: songUp, error: songErr} = await supabaseClient.storage.from('songs').upload(songPath, selectedSongFile, {upsert:true, onUploadProgress:(e)=>{let p=Math.round(e.loaded/e.total*100); document.getElementById('progressBar').style.width=p+'%'}});
if(songErr) throw songErr;

// 2. Get public URL
let {data: urlData} = supabaseClient.storage.from('songs').getPublicUrl(songPath);
let songUrl = urlData.publicUrl;

// 3. Optional: upload pic
let picUrl = "";
if(selectedPicFile){
let picPath = Date.now()+"_"+selectedPicFile.name;
await supabaseClient.storage.from('avatars').upload(picPath, selectedPicFile, {upsert:true});
let {data: pData} = supabaseClient.storage.from('avatars').getPublicUrl(picPath);
picUrl = pData.publicUrl;
}

// 4. Save to table 'songs'
let {error: dbErr} = await supabaseClient.from('songs').insert([{title: title, artist: artist, url: songUrl, cover: picUrl, plays:0, status:'approved', artist_id: currentUser}]);
if(dbErr) throw dbErr;

document.getElementById('status').innerText = "✅ UPLOADED! Everyone can now play it on nilesoniq.github.io/NILE/";
document.getElementById('progressBar').style.width='100%';
alert("SUCCESS Boss! Song live on site!");
loadSongs();
loadMySongs();

}catch(err){
console.error(err);
document.getElementById('status').innerText = "❌ Error: "+err.message+" - Make sure you created buckets 'songs' and 'avatars' as PUBLIC in Supabase Storage!";
}
}

async function loadSongs(){
let {data, error} = await supabaseClient.from('songs').select('*').eq('status','approved').order('created_at',{ascending:false}).limit(50);
if(error){console.log(error); return;}
let html = "";
data.forEach(s=>{
html+=`<div class="card"><img src="${s.cover||'https://via.placeholder.com/60?text=NILE'}"><div style="flex:1"><b>${s.title}</b><br><small>${s.artist} • ${s.plays||0} plays</small></div><button class="btn" onclick="playSong('${s.url}','${s.title} - ${s.artist}')">▶️</button></div>`;
});
document.getElementById('trendingList').innerHTML = html;
document.getElementById('newList').innerHTML = html;
document.getElementById('topList').innerHTML = data.sort((a,b)=>b.plays-a.plays).map(s=>`<div class="card"><img src="${s.cover||'https://via.placeholder.com/60?text=NILE'}"><div style="flex:1"><b>${s.title}</b><br><small>${s.artist}</small></div><button class="btn" onclick="playSong('${s.url}','${s.title}')">▶️</button></div>`).join('');
}
async function loadMySongs(){
if(!currentUser) return;
let {data} = await supabaseClient.from('songs').select('*').eq('artist_id',currentUser).order('created_at',{ascending:false});
if(!data) return;
document.getElementById('mySongs').innerHTML = data.map(s=>`<div class="card"><div style="flex:1"><b>${s.title}</b><br><small>${s.status}</small></div><button class="btn" onclick="playSong('${s.url}','${s.title}')">▶️</button></div>`).join('');
}
function playSong(url, title){
let a=document.getElementById('audio');
document.getElementById('homePlayer').style.display='block';
a.src=url; a.play();
document.getElementById('nowPlaying').innerText="Now Playing: "+title;
}
loadSongs();
</script>
</body>
</html>
