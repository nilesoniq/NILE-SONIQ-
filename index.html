<script>

/* =========================================================
   NILE SONIQ DATABASE
========================================================= */

const KEY = "nilesoniq_v1";

let db = JSON.parse(localStorage.getItem(KEY) || "null") || {
  settings: {
    rate: 0.5,
    minPayout: 10000
  },

  users: [],

  songs: [
    {
      id: 1,
      title: "Eyiyu Kuda",
      artist: "Ston Boi Ft Kv",
      plays: 0,
      created: Date.now(),
      cover: "",
      audio: "",
      reviewStatus: "approved",
      rejectionReason: ""
    }
  ]
};


/* =========================================================
   UPGRADE OLD DATA
========================================================= */

if (!db.settings) {
  db.settings = {
    rate: 0.5,
    minPayout: 10000
  };
}

if (!Array.isArray(db.users)) {
  db.users = [];
}

if (!Array.isArray(db.songs)) {
  db.songs = [];
}

db.songs.forEach(song => {

  if (!song.reviewStatus) {
    song.reviewStatus = "approved";
  }

  if (typeof song.rejectionReason === "undefined") {
    song.rejectionReason = "";
  }

  if (typeof song.plays !== "number") {
    song.plays = 0;
  }

});


let currentUser = JSON.parse(
  localStorage.getItem("nilesoniq_user") || "null"
);


/* =========================================================
   AUDIO PLAYER
========================================================= */

const audio = new Audio();

audio.preload = "auto";
audio.volume = 0.8;

let currentSong = null;


/* =========================================================
   SAVE DATABASE
========================================================= */

function save() {

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify(db)
    );

  } catch (error) {

    console.error("NileSoniq save error:", error);

    toast(
      "Storage is full. Large audio files cannot be stored permanently in this browser."
    );

  }

}


/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(s) {

  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );

}


function money(n) {

  return Number(n || 0).toLocaleString("en-UG");

}


function toast(message) {

  const box = document.getElementById("toast");

  if (!box) return;

  box.textContent = message;
  box.style.display = "block";

  clearTimeout(window._toast);

  window._toast = setTimeout(() => {

    box.style.display = "none";

  }, 3000);

}


function initials(name) {

  return esc(
    (name || "?")
      .split(/\s+/)
      .map(x => x[0])
      .join("")
      .slice(0, 2)
      .toUpperCase()
  );

}


function safeFileName(name) {

  return String(name || "NileSoniq Song")
    .replace(/[\\/:*?"<>|]/g, "-")
    .replace(/\s+/g, " ")
    .trim() || "NileSoniq Song";

}


/* =========================================================
   REVIEW STATUS
========================================================= */

function getStatus(song) {

  if (!song) {
    return "pending";
  }

  return song.reviewStatus || "approved";

}


function statusText(status) {

  if (status === "approved") {
    return "Approved";
  }

  if (status === "rejected") {
    return "Rejected";
  }

  return "Pending";
}


function statusHtml(song) {

  const status = getStatus(song);

  return `
    <span class="review-status ${status}">
      ${statusText(status)}
    </span>
  `;

}


/* =========================================================
   NAVIGATION
========================================================= */

function nav() {

  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.onclick = () => {
        showPage(button.dataset.page);
      };

    });

  updateAuth();

}


function showPage(id) {

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove("active");

    });


  const page = document.getElementById(id);

  if (!page) {
    return;
  }


  page.classList.add("active");


  document
    .querySelectorAll(".nav button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === id
      );

    });


  if (id === "home") {
    renderHome();
  }

  if (id === "artists") {
    renderArtists();
  }

  if (id === "dashboard") {
    renderDashboard();
  }

  if (id === "admin") {
    renderAdmin();
  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =========================================================
   AUTH
========================================================= */

function updateAuth() {

  const email = document.getElementById("userEmail");

  if (email) {
    email.textContent = currentUser?.email || "";
  }


  const authBtn = document.getElementById("authBtn");

  if (authBtn) {

    authBtn.textContent =
      currentUser ? "Logout" : "Artist Login";

    authBtn.onclick =
      currentUser ? logout : openAuth;

  }


  const dashNav = document.getElementById("dashNav");

  if (dashNav) {

    dashNav.style.display =
      currentUser ? "inline-block" : "none";

  }


  const adminNav = document.getElementById("adminNav");

  if (adminNav) {

    adminNav.style.display =
      currentUser?.admin ? "inline-block" : "none";

  }

}


function openAuth() {

  document
    .getElementById("authModal")
    .classList.add("show");

}


function closeAuth() {

  document
    .getElementById("authModal")
    .classList.remove("show");

}


function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const name =
    document
      .getElementById("loginArtist")
      .value
      .trim() ||
    "New Artist";


  if (!email) {

    toast("Enter your email");

    return;

  }


  let user =
    db.users.find(
      x => x.email === email
    );


  if (!user) {

    user = {

      id: Date.now(),

      email: email,

      name: name,

      bio: "",

      avatar: "",

      admin: false

    };

    db.users.push(user);

  } else {

    user.name = name || user.name;

  }


  currentUser = user;


  localStorage.setItem(
    "nilesoniq_user",
    JSON.stringify(user)
  );


  save();

  closeAuth();

  updateAuth();

  toast("Welcome " + user.name + "!");

  showPage("dashboard");

}


function logout() {

  currentUser = null;

  localStorage.removeItem(
    "nilesoniq_user"
  );

  updateAuth();

  showPage("home");

  toast("Logged out");

}


function ensureLogin() {

  if (!currentUser) {

    openAuth();

    toast("Artist login required");

    return false;

  }

  return true;

}


/* =========================================================
   COVER
========================================================= */

function coverStyle(song) {

  if (!song.cover) {
    return "";
  }

  return `
    background-image:url("${song.cover}");
  `;

}


/* =========================================================
   PUBLIC SONG CARD
========================================================= */

function songCard(song) {

  if (getStatus(song) !== "approved") {
    return "";
  }


  return `

    <article class="card">

      <div
        class="art"
        style="${coverStyle(song)}">

        ${
          song.cover
          ? ""
          : "<span class='note'>♫</span>"
        }

        <button
          class="play-round"
          onclick="playSong(${song.id})">

          ▶

        </button>

      </div>


      <div class="card-body">

        <div class="song-title">
          ${esc(song.title)}
        </div>


        <div class="sub">
          ${esc(song.artist)}
          • ${song.plays || 0} plays
        </div>


        <div class="card-actions">

          <button
            class="main"
            onclick="playSong(${song.id})">

            ▶ Play

          </button>


          <button
            class="download-btn"
            onclick="downloadSong(${song.id})">

            ↓ Download

          </button>


          <button
            onclick="shareSong(${song.id})">

            Share

          </button>

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   PUBLIC SONG FILTER
========================================================= */

function filteredSongs() {

  const search =
    (
      document.getElementById("search")?.value ||
      ""
    )
    .toLowerCase()
    .trim();


  return db.songs.filter(song => {

    if (getStatus(song) !== "approved") {
      return false;
    }


    const title =
      String(song.title || "")
        .toLowerCase();


    const artist =
      String(song.artist || "")
        .toLowerCase();


    return (
      !search ||
      title.includes(search) ||
      artist.includes(search)
    );

  });

}


/* =========================================================
   HOME
========================================================= */

function renderHome() {

  const songs = filteredSongs();


  const sorted = [...songs].sort(
    (a, b) =>
      (b.plays || 0) -
      (a.plays || 0)
  );


  const fresh = [...songs].sort(
    (a, b) =>
      (b.created || 0) -
      (a.created || 0)
  );


  document.getElementById(
    "trendCount"
  ).textContent =
    songs.length + " SONGS";


  document.getElementById(
    "trending"
  ).innerHTML =
    sorted
      .slice(0, 8)
      .map(songCard)
      .join("") ||

    `
      <div class="empty">
        No approved music found.
      </div>
    `;


  document.getElementById(
    "newReleases"
  ).innerHTML =
    fresh
      .slice(0, 8)
      .map(songCard)
      .join("") ||

    `
      <div class="empty">
        No approved new releases yet.
      </div>
    `;


  document.getElementById(
    "topCharts"
  ).innerHTML =
    sorted
      .slice(0, 8)
      .map(songCard)
      .join("") ||

    `
      <div class="empty">
        No approved charts yet.
      </div>
    `;

}


/* =========================================================
   ARTISTS
========================================================= */

function renderArtists() {

  const map = {};


  db.songs
    .filter(
      song =>
        getStatus(song) === "approved"
    )
    .forEach(song => {

      const name =
        String(song.artist || "").trim();

      if (!name) {
        return;
      }

      map[name] =
        (map[name] || 0) + 1;

    });


  const users =
    db.users.map(user => ({

      name: user.name,

      avatar: user.avatar

    }));


  const names =
    [
      ...new Set([
        ...Object.keys(map),
        ...users.map(x => x.name)
      ])
    ];


  document.getElementById(
    "artistCount"
  ).textContent =
    names.length + " ARTISTS";


  document.getElementById(
    "artistList"
  ).innerHTML =

    names.map(name => {

      const user =
        users.find(
          x => x.name === name
        );


      return `

        <div class="card artist-card">

          <div class="avatar">

            ${
              user?.avatar

              ?

              `
                <img
                  src="${user.avatar}"
                  style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:50%
                  "
                >
              `

              :

              initials(name)

            }

          </div>


          <div>

            <div class="song-title">
              ${esc(name)}
            </div>

            <div class="sub">
              ${map[name] || 0}
              approved songs
            </div>

          </div>

        </div>

      `;

    }).join("") ||

    `
      <div class="empty">
        No artists yet.
      </div>
    `;

}


/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard() {

  if (!ensureLogin()) {
    return;
  }


  const user =
    db.users.find(
      x => x.id === currentUser.id
    ) ||
    currentUser;


  currentUser = user;


  localStorage.setItem(
    "nilesoniq_user",
    JSON.stringify(user)
  );


  const songs =
    db.songs.filter(
      song =>
        song.artist === user.name
    );


  const plays =
    songs.reduce(
      (total, song) =>
        total + (song.plays || 0),
      0
    );


  document.getElementById(
    "myPlays"
  ).textContent = plays;


  document.getElementById(
    "myEarnings"
  ).textContent =
    money(
      plays * db.settings.rate
    );


  document.getElementById(
    "mySongs"
  ).textContent =
    songs.length;


  document.getElementById(
    "profileName"
  ).value =
    user.name || "";


  document.getElementById(
    "profileBio"
  ).value =
    user.bio || "";


  document.getElementById(
    "profilePreview"
  ).innerHTML =
    user.avatar
    ?

    `
      <img
        src="${user.avatar}"
        class="avatar"
        style="margin:8px 0 14px"
      >
    `

    :

    "";


  document.getElementById(
    "mySongList"
  ).innerHTML =

    songs.map(song => {

      const status =
        getStatus(song);


      return `

        <div
          class="artist-card"
          style="
            margin-bottom:10px;
            border:1px solid #292929;
            border-radius:18px;
          "
        >

          <div
            class="avatar"
            style="
              width:55px;
              height:55px;
            "
          >

            ${
              song.cover

              ?

              `
                <img
                  src="${song.cover}"
                  style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    border-radius:50%
                  "
                >
              `

              :

              "♫"

            }

          </div>


          <div style="flex:1">

            <b>
              ${esc(song.title)}
            </b>


            <div class="sub">

              ${song.plays || 0}
              plays

              • UGX

              ${money(
                (song.plays || 0) *
                db.settings.rate
              )}

            </div>


            ${statusHtml(song)}


            ${
              status === "rejected" &&
              song.rejectionReason

              ?

              `
                <div class="rejection-reason">

                  <strong>
                    Reason:
                  </strong>

                  ${esc(
                    song.rejectionReason
                  )}

                </div>
              `

              :

              ""

            }

          </div>


          <button
            class="ghost-btn"
            onclick="deleteSong(${song.id})">

            Delete

          </button>

        </div>

      `;

    }).join("") ||

    `
      <div class="empty">
        You have not uploaded a song yet.
      </div>
    `;

}


/* =========================================================
   PROFILE
========================================================= */

function previewProfile() {

  const file =
    document
      .getElementById("profileImage")
      .files[0];


  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload = () => {

    document.getElementById(
      "profilePreview"
    ).innerHTML = `

      <img
        src="${reader.result}"
        class="avatar"
        style="margin:8px 0 14px"
      >

    `;

  };


  reader.readAsDataURL(file);

}


function saveProfile() {

  if (!ensureLogin()) {
    return;
  }


  const user =
    db.users.find(
      x => x.id === currentUser.id
    );


  if (!user) {
    return;
  }


  const oldName =
    user.name;


  const newName =
    document
      .getElementById("profileName")
      .value
      .trim() ||
    user.name;


  user.name =
    newName;


  user.bio =
    document
      .getElementById("profileBio")
      .value
      .trim();


  if (oldName !== newName) {

    db.songs.forEach(song => {

      if (song.artist === oldName) {
        song.artist = newName;
      }

    });

  }


  const file =
    document
      .getElementById("profileImage")
      .files[0];


  const finish = () => {

    currentUser = user;


    localStorage.setItem(
      "nilesoniq_user",
      JSON.stringify(user)
    );


    save();

    updateAuth();

    toast("Profile saved");

    renderDashboard();

    renderArtists();

  };


  if (file) {

    const reader =
      new FileReader();


    reader.onload = () => {

      user.avatar =
        reader.result;

      finish();

    };


    reader.readAsDataURL(file);

  } else {

    finish();

  }

}


/* =========================================================
   UPLOAD SONG
========================================================= */

function showSelectedFile() {

  const file =
    document
      .getElementById("songFile")
      .files[0];


  document.getElementById(
    "selectedFile"
  ).textContent =
    file
    ? "Selected: " + file.name
    : "";

}


function uploadSong() {

  if (!ensureLogin()) {
    return;
  }


  const title =
    document
      .getElementById("songTitle")
      .value
      .trim();


  const artist =
    document
      .getElementById("songArtist")
      .value
      .trim() ||
    currentUser.name;


  const file =
    document
      .getElementById("songFile")
      .files[0];


  const url =
    document
      .getElementById("songUrl")
      .value
      .trim();


  const cover =
    document
      .getElementById("songCover")
      .files[0];


  if (!title) {

    toast("Enter a song title");

    return;

  }


  if (!file && !url) {

    toast(
      "Choose an audio file or paste an audio link"
    );

    return;

  }


  const song = {

    id: Date.now(),

    title: title,

    artist: artist,

    plays: 0,

    created: Date.now(),

    cover: "",

    audio: url || "",

    reviewStatus: "pending",

    rejectionReason: ""

  };


  const finish = () => {

    db.songs.unshift(song);

    save();


    toast(
      "Song submitted for admin approval"
    );


    document.getElementById(
      "songTitle"
    ).value = "";


    document.getElementById(
      "songUrl"
    ).value = "";


    document.getElementById(
      "songFile"
    ).value = "";


    document.getElementById(
      "songCover"
    ).value = "";


    document.getElementById(
      "selectedFile"
    ).textContent = "";


    renderDashboard();

    renderHome();

  };


  const readCover = () => {

    if (!cover) {

      finish();

      return;

    }


    const reader =
      new FileReader();


    reader.onload = () => {

      song.cover =
        reader.result;

      finish();

    };


    reader.readAsDataURL(cover);

  };


  if (file) {

    const reader =
      new FileReader();


    reader.onload = () => {

      song.audio =
        reader.result;

      readCover();

    };


    reader.onerror = () => {

      toast(
        "Could not read the audio file"
      );

    };


    reader.readAsDataURL(file);

  } else {

    readCover();

  }

}


/* =========================================================
   DELETE
========================================================= */

function deleteSong(id) {

  if (
    !confirm(
      "Delete this song?"
    )
  ) {
    return;
  }


  db.songs =
    db.songs.filter(
      song =>
        song.id !== id
    );


  if (
    currentSong &&
    currentSong.id === id
  ) {

    audio.pause();

    audio.removeAttribute("src");

    audio.load();

    currentSong = null;

    document.getElementById(
      "player"
    ).style.display = "none";

  }


  save();

  renderDashboard();

  renderAdmin();

  renderHome();

  renderArtists();

  toast("Song deleted");

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadSong(id) {

  const song =
    db.songs.find(
      x => x.id === id
    );


  if (!song) {

    toast("Song not found");

    return;

  }


  if (getStatus(song) !== "approved") {

    toast(
      "This song is not approved"
    );

    return;

  }


  if (!song.audio) {

    toast(
      "This song has no audio file"
    );

    return;

  }


  const link =
    document.createElement("a");


  link.href =
    song.audio;


  link.download =
    safeFileName(
      song.title + " - " + song.artist
    ) + ".mp3";


  document.body.appendChild(link);

  link.click();

  link.remove();


  toast(
    "Download started"
  );

}


/* =========================================================
   FIXED AUDIO PLAYER
========================================================= */

function playSong(id) {

  const song =
    db.songs.find(
      x => x.id === id
    );


  if (!song) {

    toast("Song not found");

    return;

  }


  if (getStatus(song) !== "approved") {

    toast(
      "This song is not approved yet"
    );

    return;

  }


  if (!song.audio) {

    toast(
      "This song has no audio file attached"
    );

    return;

  }


  /*
    Stop the previous song first.
  */

  audio.pause();

  audio.currentTime = 0;


  /*
    Set the new audio source.
  */

  audio.src = song.audio;


  audio.volume =
    Number(
      document.getElementById("volume")?.value || 0.8
    );


  currentSong = song;


  /*
    Show player BEFORE starting playback.
  */

  document.getElementById(
    "player"
  ).style.display = "block";


  document.getElementById(
    "nowTitle"
  ).textContent =
    song.title;


  document.getElementById(
    "nowArtist"
  ).textContent =
    song.artist;


  document.getElementById(
    "progress"
  ).value = 0;


  document.getElementById(
    "playPause"
  ).textContent = "▶";


  /*
    Load the audio.
  */

  audio.load();


  /*
    IMPORTANT:
    Only count a play after the browser
    successfully starts the audio.
  */

  audio.play()
    .then(() => {

      document.getElementById(
        "playPause"
      ).textContent = "Ⅱ";


      song.plays =
        (song.plays || 0) + 1;


      save();


      renderHome();

      if (currentUser) {
        renderDashboard();
      }

    })
    .catch(error => {

      console.error(
        "NileSoniq audio error:",
        error
      );


      document.getElementById(
        "playPause"
      ).textContent = "▶";


      toast(
        "This audio file cannot be played. Check the audio file or link."
      );

    });

}


/* =========================================================
   PLAY / PAUSE
========================================================= */

function togglePlay() {

  if (!currentSong) {

    toast(
      "Choose a song first"
    );

    return;

  }


  if (
    getStatus(currentSong) !==
    "approved"
  ) {

    toast(
      "This song is not approved"
    );

    return;

  }


  if (!audio.src) {

    playSong(currentSong.id);

    return;

  }


  if (audio.paused) {

    audio.play()
      .then(() => {

        document.getElementById(
          "playPause"
        ).textContent = "Ⅱ";

      })
      .catch(() => {

        toast(
          "Unable to play this audio"
        );

      });

  } else {

    audio.pause();

    document.getElementById(
      "playPause"
    ).textContent = "▶";

  }

}


/* =========================================================
   STOP
========================================================= */

function stopAudio() {

  audio.pause();

  audio.currentTime = 0;


  document.getElementById(
    "playPause"
  ).textContent = "▶";


  document.getElementById(
    "progress"
  ).value = 0;

}


/* =========================================================
   RESTART
========================================================= */

function restart() {

  if (!currentSong) {
    return;
  }


  audio.currentTime = 0;


  audio.play()
    .then(() => {

      document.getElementById(
        "playPause"
      ).textContent = "Ⅱ";

    })
    .catch(() => {

      toast(
        "Unable to play this audio"
      );

    });

}


/* =========================================================
   SEEK
========================================================= */

function seek(value) {

  if (
    audio.duration &&
    isFinite(audio.duration)
  ) {

    audio.currentTime =
      (
        Number(value) / 100
      ) *
      audio.duration;

  }

}


/* =========================================================
   AUDIO EVENTS
========================================================= */

audio.addEventListener(
  "loadedmetadata",
  () => {

    const progress =
      document.getElementById("progress");

    if (progress) {
      progress.value = 0;
    }

  }
);


audio.addEventListener(
  "timeupdate",
  () => {

    if (
      audio.duration &&
      isFinite(audio.duration)
    ) {

      document.getElementById(
        "progress"
      ).value =

        (
          audio.currentTime /
          audio.duration
        ) * 100;

    }

  }
);


audio.addEventListener(
  "play",
  () => {

    document.getElementById(
      "playPause"
    ).textContent = "Ⅱ";

  }
);


audio.addEventListener(
  "pause",
  () => {

    document.getElementById(
      "playPause"
    ).textContent = "▶";

  }
);


audio.addEventListener(
  "ended",
  () => {

    document.getElementById(
      "playPause"
    ).textContent = "▶";


    document.getElementById(
      "progress"
    ).value = 0;

  }
);


audio.addEventListener(
  "error",
  () => {

    console.error(
      "Audio element error:",
      audio.error
    );

    document.getElementById(
      "playPause"
    ).textContent = "▶";

  }
);


/* =========================================================
   SHARE
========================================================= */

function shareSong(id) {

  const song =
    db.songs.find(
      x => x.id === id
    );


  if (!song) {
    return;
  }


  const text =
    `${song.title} by ${song.artist} — NileSoniq`;


  if (navigator.share) {

    navigator.share({
      title: text,
      text: text,
      url: location.href
    }).catch(() => {});

  } else if (navigator.clipboard) {

    navigator.clipboard
      .writeText(location.href)
      .then(() => {

        toast(
          "NileSoniq link copied"
        );

      });

  } else {

    toast(
      "Copy the website link to share"
    );

  }

}


/* =========================================================
   APPROVE SONG
========================================================= */

function approveSong(id) {

  if (!currentUser?.admin) {

    toast(
      "Admin access required"
    );

    return;

  }


  const song =
    db.songs.find(
      x => x.id === id
    );


  if (!song) {
    return;
  }


  song.reviewStatus =
    "approved";


  song.rejectionReason =
    "";


  save();


  toast(
    "Song approved successfully"
  );


  renderAdmin();

  renderHome();

  renderArtists();

  renderDashboard();

}


/* =========================================================
   REJECT SONG
========================================================= */

function rejectSong(id) {

  if (!currentUser?.admin) {

    toast(
      "Admin access required"
    );

    return;

  }


  const song =
    db.songs.find(
      x => x.id === id
    );


  if (!song) {
    return;
  }


  const reason =
    prompt(
      "Why are you rejecting this song?"
    );


  if (reason === null) {
    return;
  }


  const cleanReason =
    reason.trim();


  if (!cleanReason) {

    toast(
      "Please enter a rejection reason"
    );

    return;

  }


  song.reviewStatus =
    "rejected";


  song.rejectionReason =
    cleanReason;


  save();


  toast(
    "Song rejected"
  );


  renderAdmin();

  renderHome();

  renderArtists();

  renderDashboard();

}


/* =========================================================
   ADMIN DASHBOARD
========================================================= */

function renderAdmin() {

  if (!currentUser?.admin) {
    return;
  }


  const totalPlays =
    db.songs.reduce(
      (total, song) =>
        total + (song.plays || 0),
      0
    );


  document.getElementById(
    "adminSongs"
  ).textContent =
    db.songs.length;


  document.getElementById(
    "adminPlays"
  ).textContent =
    totalPlays;


  document.getElementById(
    "adminArtists"
  ).textContent =
    new Set(
      db.songs.map(
        song => song.artist
      )
    ).size;


  document.getElementById(
    "rate"
  ).value =
    db.settings.rate;


  document.getElementById(
    "minPayout"
  ).value =
    db.settings.minPayout;


  const rows =
    db.songs.map(song => {

      const status =
        getStatus(song);


      let actions = "";


      if (status === "pending") {

        actions = `

          <button
            class="orange-btn"
            style="
              padding:8px 12px;
              margin-right:5px;
            "
            onclick="approveSong(${song.id})">

            Approve

          </button>


          <button
            class="ghost-btn"
            style="
              padding:8px 12px;
            "
            onclick="rejectSong(${song.id})">

            Reject

          </button>

        `;

      }


      if (status === "approved") {

        actions = `

          <span
            class="review-status approved">

            Approved

          </span>


          <button
            class="ghost-btn"
            style="
              padding:7px 10px;
              margin-left:5px;
            "
            onclick="rejectSong(${song.id})">

            Reject

          </button>

        `;

      }


      if (status === "rejected") {

        actions = `

          <span
            class="review-status rejected">

            Rejected

          </span>


          <button
            class="orange-btn"
            style="
              padding:7px 10px;
              margin-left:5px;
            "
            onclick="approveSong(${song.id})">

            Approve Again

          </button>

        `;

      }


      return `

        <tr>

          <td>

            <strong>
              ${esc(song.title)}
            </strong>


            ${
              status === "rejected" &&
              song.rejectionReason

              ?

              `
                <div
                  class="rejection-reason">

                  <strong>
                    Reason:
                  </strong>

                  ${esc(
                    song.rejectionReason
                  )}

                </div>
              `

              :

              ""

            }

          </td>


          <td>
            ${esc(song.artist)}
          </td>


          <td>
            ${statusHtml(song)}
          </td>


          <td>
            ${song.plays || 0}
          </td>


          <td>

            UGX
            ${money(
              (song.plays || 0) *
              db.settings.rate
            )}

          </td>


          <td>

            ${actions}

            <br>

            <button
              class="ghost-btn"
              style="
                padding:7px 10px;
                margin-top:7px;
              "
              onclick="deleteSong(${song.id})">

              Delete

            </button>

          </td>

        </tr>

      `;

    }).join("");


  document.getElementById(
    "adminSongList"
  ).innerHTML = `

    <div class="table-wrap">

      <table class="table">

        <thead>

          <tr>

            <th>Song</th>

            <th>Artist</th>

            <th>Status</th>

            <th>Plays</th>

            <th>Earnings</th>

            <th>Action</th>

          </tr>

        </thead>


        <tbody>

          ${
            rows ||

            `
              <tr>

                <td
                  colspan="6"
                  style="
                    text-align:center;
                    color:#777;
                  ">

                  No songs yet.

                </td>

              </tr>
            `
          }

        </tbody>

      </table>

    </div>

  `;

}


/* =========================================================
   SETTINGS
========================================================= */

function saveSettings() {

  if (!currentUser?.admin) {

    toast(
      "Admin access required"
    );

    return;

  }


  db.settings.rate =
    Number(
      document.getElementById("rate").value
    ) || 0;


  db.settings.minPayout =
    Number(
      document.getElementById("minPayout").value
    ) || 0;


  save();

  toast(
    "Settings saved"
  );

  renderAdmin();

}


/* =========================================================
   OWNER ADMIN
========================================================= */

function makeAdmin() {

  const owner =
    new URLSearchParams(
      location.search
    ).get("owner");


  if (
    owner === "1" &&
    currentUser
  ) {

    const user =
      db.users.find(
        x =>
          x.id ===
          currentUser.id
      );


    if (!user) {
      return;
    }


    user.admin = true;


    currentUser = user;


    localStorage.setItem(
      "nilesoniq_user",
      JSON.stringify(user)
    );


    save();

    updateAuth();

    toast(
      "Owner/admin mode enabled"
    );


    showPage("admin");

  }

}
