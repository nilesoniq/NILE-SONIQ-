<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NileSoniq — Ugandan Music Platform</title>

<meta name="description"
content="NileSoniq is an artist-first Ugandan music platform where listeners can stream approved songs, discover artists, explore releases, and read original music stories.">
<link rel="canonical" href="https://nilesoniq.com/">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<style>
:root{
  --bg:#0a0a0a;
  --bg2:#111;
  --card:#171717;
  --orange:#ff6a00;
  --orange2:#ff8a2b;
  --white:#fff;
  --muted:#a8a8a8;
  --border:#292929;
  --danger:#ff4040;
  --success:#2ecc71;
  --warning:#f1c40f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:white;
  line-height:1.5;
  padding-bottom:105px;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
  display:block;
}

.hidden{
  display:none!important;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(10,10,10,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(15px);
}

.header-inner{
  max-width:1250px;
  margin:auto;
  min-height:72px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:var(--orange);
}

nav{
  display:flex;
  align-items:center;
  gap:8px;
}

nav button{
  background:transparent;
  color:#ddd;
  border:none;
  padding:10px 12px;
  border-radius:10px;
}

nav button:hover,
nav button.active{
  background:#1d1d1d;
  color:var(--orange);
}

.auth-buttons{
  display:flex;
  gap:8px;
  align-items:center;
}

.btn{
  border:none;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-orange{
  background:var(--orange);
  color:white;
}

.btn-orange:hover{
  background:var(--orange2);
}

.btn-dark{
  background:#202020;
  color:white;
  border:1px solid var(--border);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-success{
  background:var(--success);
  color:#08150d;
}

.btn-warning{
  background:var(--warning);
  color:#111;
}

.menu-btn{
  display:none;
  background:transparent;
  color:white;
  border:1px solid var(--border);
  border-radius:9px;
  padding:8px 11px;
}

.container{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

.page{
  display:none;
  min-height:600px;
}

.page.active{
  display:block;
}

/* HERO */

.hero{
  padding:70px 0 55px;
}

.hero-box{
  border:1px solid var(--border);
  background:
    radial-gradient(circle at 90% 10%,rgba(255,106,0,.18),transparent 35%),
    linear-gradient(135deg,#121212,#0c0c0c);
  border-radius:28px;
  padding:70px 55px;
}

.badge{
  display:inline-flex;
  background:rgba(255,106,0,.12);
  border:1px solid rgba(255,106,0,.3);
  color:var(--orange2);
  padding:8px 13px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-bottom:22px;
}

.hero h1{
  font-size:clamp(42px,7vw,78px);
  line-height:.98;
  max-width:800px;
  letter-spacing:-3px;
  margin-bottom:22px;
}

.hero h1 span{
  color:var(--orange);
}

.hero p{
  color:#bdbdbd;
  max-width:650px;
  font-size:19px;
  margin-bottom:28px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

/* SECTIONS */

.section{
  padding:35px 0;
}

.section-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.section-heading h2{
  font-size:28px;
}

.section-heading p{
  color:var(--muted);
  font-size:14px;
}

.search-box{
  margin-bottom:30px;
  position:relative;
}

.search-box input{
  width:100%;
  background:#151515;
  border:1px solid var(--border);
  color:white;
  padding:17px 50px 17px 20px;
  border-radius:15px;
  outline:none;
}

.search-box input:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 3px rgba(255,106,0,.08);
}

.search-box input::placeholder{
  color:#777;
}

.search-status{
  margin-top:10px;
  color:#888;
  font-size:13px;
  min-height:20px;
}

.ad-space{
  margin:10px 0;
  min-height:120px;
  border:1px dashed #333;
  border-radius:18px;
  background:linear-gradient(135deg,#101010,#0c0c0c);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#666;
  font-size:12px;
}

.ad-space strong{
  display:block;
  color:#888;
  font-size:13px;
  margin-bottom:4px;
}

/* SONG LIST */

.song-grid{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.song-card{
  width:100%;
  min-height:82px;
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px;
  overflow:hidden;
  transition:.2s;
}

.song-card:hover{
  border-color:#444;
}

.song-card.playing{
  border-color:var(--orange);
  background:#1c1510;
}

.cover{
  width:62px;
  height:62px;
  min-width:62px;
  border-radius:10px;
  overflow:hidden;
  background:#222;
  position:relative;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cover-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  color:var(--orange);
  background:linear-gradient(135deg,#242424,#111);
}

.play-circle{
  width:30px;
  height:30px;
  border-radius:50%;
  background:var(--orange);
  color:white;
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  position:absolute;
  right:4px;
  bottom:4px;
  font-size:12px;
}

.song-info{
  flex:1;
  min-width:0;
}

.song-title{
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:15px;
}

.artist-name{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-meta{
  display:flex;
  gap:15px;
  color:#888;
  font-size:11px;
  margin-top:4px;
}

.download-btn{
  width:auto;
  min-width:100px;
  padding:8px 11px;
  border:1px solid #333;
  border-radius:9px;
  background:#222;
  color:white;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.download-btn:hover{
  background:var(--orange);
  border-color:var(--orange);
}

.download-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ARTISTS */

.artist-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.artist-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  text-align:center;
}

.artist-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  overflow:hidden;
  margin:0 auto 14px;
  background:#242424;
  border:2px solid #333;
}

.artist-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.artist-avatar-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--orange);
  font-size:40px;
  font-weight:bold;
}

.artist-card h3{
  margin-bottom:4px;
}

.artist-card p{
  color:var(--muted);
  font-size:13px;
}

/* DASHBOARD */

.dashboard-header{
  padding:45px 0 25px;
}

.dashboard-header h1{
  font-size:38px;
}

.dashboard-header p{
  color:var(--muted);
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:25px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.stat-card span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.stat-card strong{
  font-size:28px;
}

.balance-card{
  border-color:rgba(255,106,0,.35);
  background:
    radial-gradient(circle at 90% 10%,rgba(255,106,0,.12),transparent 45%),
    var(--card);
  margin-bottom:20px;
}

.balance-card strong{
  color:var(--orange2);
}

.withdrawal-minimum{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.dashboard-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
}

.dashboard-card h2{
  margin-bottom:18px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.field{
  margin-bottom:15px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  color:#ccc;
  font-size:13px;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  background:#101010;
  color:white;
  border:1px solid var(--border);
  border-radius:11px;
  padding:13px;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--orange);
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

input[type=file]{
  padding:10px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  text-align:left;
  padding:13px 10px;
  border-bottom:1px solid var(--border);
}

th{
  color:#999;
  font-size:12px;
  text-transform:uppercase;
}

td{
  font-size:14px;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:bold;
}

.status.pending{
  background:rgba(255,106,0,.12);
  color:var(--orange2);
}

.status.processing{
  background:rgba(241,196,15,.12);
  color:var(--warning);
}

.status.approved,
.status.paid{
  background:rgba(46,204,113,.12);
  color:var(--success);
}

.status.rejected{
  background:rgba(255,64,64,.12);
  color:#ff7777;
}

.status.active{
  background:rgba(46,204,113,.12);
  color:var(--success);
}

.status.inactive{
  background:rgba(255,64,64,.12);
  color:#ff7777;
}

.admin-badge{
  display:inline-block;
  background:rgba(255,106,0,.12);
  color:var(--orange2);
  border:1px solid rgba(255,106,0,.3);
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
  margin-top:8px;
}

.admin-tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.admin-tabs button{
  background:#202020;
  border:1px solid var(--border);
  color:#ddd;
  padding:10px 14px;
  border-radius:10px;
}

.admin-tabs button.active{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
}

/* SMALL DASHBOARDS */

#dashboardPage .container{
  width:min(940px,calc(100% - 32px));
}

#dashboardPage .dashboard-header{
  padding:28px 0 16px;
}

#dashboardPage .dashboard-header h1{
  font-size:28px;
}

#dashboardPage .dashboard-header p{
  font-size:12px;
}

#dashboardPage .stats-grid{
  gap:10px;
  margin-bottom:14px;
}

#dashboardPage .stat-card{
  border-radius:12px;
  padding:14px 16px;
}

#dashboardPage .stat-card span{
  font-size:11px;
  margin-bottom:5px;
}

#dashboardPage .stat-card strong{
  font-size:21px;
}

#dashboardPage .balance-card{
  margin-bottom:14px!important;
}

#dashboardPage .dashboard-card{
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}

#dashboardPage .dashboard-card h2{
  font-size:17px;
  margin-bottom:12px;
}

#dashboardPage .withdrawal-minimum{
  font-size:11px;
  margin-bottom:12px;
}

#dashboardPage .form-grid{
  gap:10px;
}

#dashboardPage .field{
  margin-bottom:10px;
}

#dashboardPage .field label{
  font-size:11px;
  margin-bottom:5px;
}

#dashboardPage .field input,
#dashboardPage .field textarea,
#dashboardPage .field select{
  padding:9px 10px;
  border-radius:8px;
  font-size:12px;
}

#dashboardPage .field textarea{
  min-height:75px;
}

#dashboardPage input[type=file]{
  padding:7px;
  font-size:11px;
}

#dashboardPage .dashboard-card .btn{
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
}

#dashboardPage .dashboard-card p{
  font-size:10px;
}

#dashboardPage table{
  min-width:540px;
}

#dashboardPage th,
#dashboardPage td{
  padding:9px 8px;
}

#dashboardPage th{
  font-size:10px;
}

#dashboardPage td{
  font-size:11px;
}

#dashboardPage .status{
  padding:4px 7px;
  font-size:9px;
}

/* ADMIN */

#adminPage .container{
  width:min(980px,calc(100% - 32px));
}

#adminPage .dashboard-header{
  padding:28px 0 16px;
}

#adminPage .dashboard-header h1{
  font-size:28px;
}

#adminPage .dashboard-header p{
  font-size:12px;
}

#adminPage .admin-badge{
  padding:4px 8px;
  font-size:9px;
  margin-top:5px;
}

#adminPage .admin-tabs{
  gap:5px;
  margin-bottom:12px;
}

#adminPage .admin-tabs button{
  padding:7px 10px;
  border-radius:7px;
  font-size:10px;
}

#adminPage .dashboard-card{
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

#adminPage .dashboard-card h2{
  font-size:17px;
  margin-bottom:12px;
}

#adminPage .message{
  padding:8px;
  font-size:10px;
  border-radius:7px;
  margin-bottom:10px;
}

#adminPage table{
  min-width:720px;
}

#adminPage th{
  font-size:9px;
}

#adminPage th,
#adminPage td{
  padding:8px 7px;
}

#adminPage td{
  font-size:10px;
}

#adminPage .status{
  padding:4px 7px;
  font-size:9px;
}

#adminPage .btn{
  padding:6px 8px!important;
  border-radius:6px;
  font-size:9px;
}

/* FOOTER */

.footer-admin,
.footer-admin-login{
  background:transparent;
  border:none;
  color:#777;
  padding:0;
  font-size:13px;
  cursor:pointer;
}

.footer-admin:hover,
.footer-admin-login:hover{
  color:var(--orange);
}

footer{
  margin-top:60px;
  padding:35px 0;
  border-top:1px solid var(--border);
  color:#777;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

.footer-brand{
  font-weight:800;
  color:#ddd;
}

.footer-links{
  display:flex;
  gap:18px;
  font-size:13px;
  align-items:center;
  flex-wrap:wrap;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:2000;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(450px,100%);
  background:#151515;
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.close-btn{
  background:#222;
  color:white;
  border:none;
  border-radius:50%;
  width:34px;
  height:34px;
}
